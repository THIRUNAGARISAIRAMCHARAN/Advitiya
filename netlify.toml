# Netlify Full-Stack Configuration

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  functions = "../backend/netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "../backend/netlify/functions"
  node_bundler = "esbuild"
