[build]
  command = "cd frontend && npx vite build"
  publish = "frontend/dist"
  functions = "backend/netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"

